<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sadhanam Kayyilundo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(circle at 85% 10%, rgba(180,180,180,.10), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(120,120,120,.06), transparent 25%),
        #050505;
    color:#f5f5f5;
    min-height:100vh;
    font-family:'Manrope',sans-serif;
}

/* ================= HEADER ================= */

header{
    text-align:center;
    padding:70px 20px 55px;

    background:
        linear-gradient(
            135deg,
            #050505 0%,
            #111111 50%,
            #070707 100%
        );

    border-bottom:1px solid #292929;

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);

    position:relative;
    overflow:hidden;
}

header::after{
    content:"";
    position:absolute;
    width:300px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        #d6d6d6,
        transparent
    );
    bottom:0;
    left:50%;
    transform:translateX(-50%);
}

header h1{
    font-family:'Michroma',sans-serif;
    font-size:2.6rem;
    letter-spacing:4px;
    margin-bottom:14px;

    background:linear-gradient(
        120deg,
        #777,
        #ffffff,
        #888,
        #eeeeee
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-transform:uppercase;
}

header p{
    color:#8f8f8f;
    letter-spacing:2px;
    font-size:.85rem;
}

/* ================= CONTAINER ================= */

.container{
    width:92%;
    max-width:950px;
    margin:45px auto;
}

/* ================= CARDS ================= */

.card{
    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.95),
            rgba(9,9,9,.95)
        );

    backdrop-filter:blur(14px);

    border:1px solid #292929;

    border-radius:10px;

    padding:26px;

    margin-bottom:24px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.55);

    transition:.35s ease;

    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        #aaa,
        transparent
    );

    opacity:.45;
}

.card:hover{
    transform:translateY(-4px);

    border-color:#555;

    box-shadow:
        0 20px 55px rgba(0,0,0,.75);
}

.card h2{
    font-family:'Michroma',sans-serif;
    color:#d8d8d8;
    margin-bottom:16px;
    font-size:.95rem;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* ================= INPUTS ================= */

select,
input[type="text"],
input[type="file"]{

    width:100%;

    padding:14px 16px;

    border-radius:8px;

    border:1px solid #333;

    background:#101010;

    color:#eeeeee;

    font-size:14px;

    margin-top:10px;

    font-family:'Manrope',sans-serif;

    transition:.3s;
}

select:hover,
input[type="text"]:hover,
input[type="file"]:hover{
    border-color:#666;
}

select:focus,
input:focus{
    outline:none;
    border-color:#bdbdbd;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.05);
}

/* ================= BUTTON ================= */

.btn,
.upload-btn{

    width:100%;

    padding:15px;

    border:1px solid #777;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #eeeeee,
            #a7a7a7
        );

    color:#080808;

    font-family:'Manrope',sans-serif;

    font-size:14px;

    font-weight:700;

    letter-spacing:1px;

    cursor:pointer;

    transition:.3s;
}

.btn:hover,
.upload-btn:hover{

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #cfcfcf
        );

    transform:translateY(-2px);

    box-shadow:
        0 10px 30px rgba(255,255,255,.12);
}

.upload-btn{
    margin-top:18px;
}

/* ================= PAPERS ================= */

#papersList{
    min-height:250px !important;
    max-height:500px !important;
    overflow-y:auto !important;
}

#papersList::-webkit-scrollbar{
    width:5px;
}

#papersList::-webkit-scrollbar-track{
    background:#080808;
}

#papersList::-webkit-scrollbar-thumb{
    background:#555;
    border-radius:20px;
}

/* ================= PAPER ================= */

.paper{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px;

    margin-bottom:15px;

    background:
        linear-gradient(
            135deg,
            #151515,
            #0b0b0b
        );

    border:1px solid #292929;

    border-radius:8px;

    transition:.3s;
}

.paper:hover{

    border-color:#666;

    transform:translateX(3px);

    background:#181818;
}

.paper h3{

    margin-bottom:8px;

    color:#eeeeee;

    font-weight:600;
}

.paper p{

    color:#777;

    margin-bottom:12px;

    font-size:13px;
}

.paper a{

    display:inline-block;

    padding:9px 17px;

    background:transparent;

    color:#ddd;

    text-decoration:none;

    border:1px solid #555;

    border-radius:6px;

    font-weight:600;

    font-size:13px;

    transition:.3s;
}

.paper a:hover{

    background:#ddd;

    color:#080808;

    border-color:#ddd;
}

/* ================= FOOTER ================= */

footer{

    text-align:center;

    padding:45px 20px;

    color:#555;

    font-size:12px;

    letter-spacing:2px;

    border-top:1px solid #1d1d1d;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    header{
        padding:55px 18px 45px;
    }

    header h1{
        font-size:1.7rem;
        letter-spacing:2px;
    }

    header p{
        font-size:.75rem;
    }

    .container{
        width:94%;
        margin:30px auto;
    }

    .card{
        padding:19px;
        border-radius:9px;
    }

    .paper{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .paper a{
        width:100%;
        text-align:center;
    }

}
</style>
</head>

<body>

<header>
<h1>📚 Sadhanam Kayyilundo</h1>
<p>SJCET Previous Question Paper Repository</p>
<p><b>Sadhanam Kayyilundo? PYQ ivide und!</b></p>
</header>

<div class="container">

<div class="card">
<h2>Select Branch</h2>

<select id="filterBranch">
<option>CSE</option>
<option>AI & DS</option>
<option>ECE</option>
<option>EEE</option>
<option>Mechanical</option>
<option>Civil</option>
</select>
</div>

<div class="card">
<h2>Select Semester</h2>

<select id="filterSemester">
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>
<option>Semester 7</option>
<option>Semester 8</option>
</select>
</div>

<div class="card">
<h2>Select Exam Type</h2>

<select id="filterExam">
<option>1st Internal</option>
<option>2nd Internal</option>
<option>End Semester</option>
</select>
<br><br>

<button class="btn" onclick="loadPapers()">
View Papers
</button>

<br><br>
</div>

<div class="card">
<h2>Available Papers</h2>

<div id="papersList"></div>
</div>
<div class="card">
<h2>Upload Question Paper</h2>

<input type="text" id="subject" placeholder="Subject Name">

<select id="branch">
<option>Select Branch</option>
<option>CSE</option>
<option>AI & DS</option>
<option>ECE</option>
<option>EEE</option>
<option>Mechanical</option>
<option>Civil</option>
</select>

<select id="semester">
<option>Select Semester</option>
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>
<option>Semester 7</option>
<option>Semester 8</option>
</select>

<select id="exam">
<option>Select Exam</option>
<option>1st Internal</option>
<option>2nd Internal</option>
<option>End Semester</option>
</select>


<input
  type="file"
  id="pdfFile"
  accept=".pdf"
/>
<p style="font-size:14px;color:gray;">
</p>

<button class="upload-btn" onclick="uploadPaper()">
Upload For Review
</button>

</div> 


</div>

<footer>
<p>© Sadhanam Kayyilundo</p>
<p>Open Source PYQ Platform for Sjcet Students</p>
</footer>
<script type="module">

  
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { createClient } from "https://esm.sh/@supabase/supabase-js";
const firebaseConfig = {
  apiKey: "AIzaSyDtVwW1Ftz8q8XJukMGgSV5qsqZc9Fl2M0",
  authDomain: "sadhanam-kayyilundo-c39dd.firebaseapp.com",
  projectId: "sadhanam-kayyilundo-c39dd",
  storageBucket: "sadhanam-kayyilundo-c39dd.firebasestorage.app",
  messagingSenderId: "986132708992",
  appId: "1:986132708992:web:724843c7e3ef675315b065"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const supabase = createClient(
  "https://xczmunaxzkzfapksolxc.supabase.co",
  "sb_publishable_x2ZQqhJabAfgZiA7bY9C-Q_FIVcc7Va"
);

window.uploadPaper = async function() {

  const file =
    document.getElementById("pdfFile").files[0];

  const subject =
    document.getElementById("subject").value;

  const branch =
    document.getElementById("branch").value;

  const semester =
    document.getElementById("semester").value;

  const exam =
    document.getElementById("exam").value;
    if (
  branch === "Select Branch" ||
  semester === "Select Semester" ||
  exam === "Select Exam" ||
  subject.trim() === ""
) {
  alert("Please fill all fields");
  return;
}
  if (!file) {
    alert("Please select a PDF");
    return;
  }
  if (file.type !== "application/pdf") {
  alert("Only PDF files are allowed");
  return;
}

  try {

  const fileName =
    Date.now() + "_" + file.name;

  const { data, error } =
    await supabase.storage
      .from("papers")
      .upload(fileName, file);

  if (error) {
    throw error;
  }

  const { data: publicData } =
    supabase.storage
      .from("papers")
      .getPublicUrl(fileName);

  const pdfUrl = publicData.publicUrl;
await addDoc(collection(db, "papers"), {
  subject: subject,
  branch: branch,
  semester: semester,
  examType: exam,
  pdfUrl: pdfUrl,
  status: "pending"
});

  alert("Paper uploaded successfully!");
  
  document.getElementById("subject").value = "";
document.getElementById("pdfFile").value = "";
document.getElementById("branch").selectedIndex = 0;
document.getElementById("semester").selectedIndex = 0;
document.getElementById("exam").selectedIndex = 0;
} catch(error) {

  alert(error.message);

}
};

window.loadPapers = async function() {

  const papersList =
    document.getElementById("papersList");

  papersList.innerHTML = "";

  const branch =
    document.getElementById("filterBranch").value;

  const semester =
    document.getElementById("filterSemester").value;

  const exam =
    document.getElementById("filterExam").value;
    sessionStorage.setItem("branch", branch);
sessionStorage.setItem("semester", semester);
sessionStorage.setItem("exam", exam);


  const querySnapshot = await getDocs(
    collection(db, "papers")
  );

  querySnapshot.forEach((doc) => {

    const paper = doc.data();
if (
  paper.status === "approved" &&
  paper.branch === branch &&
  paper.semester === semester &&
  paper.examType === exam 
){

      papersList.innerHTML += `
<div class="paper">
  <span>${paper.subject}</span>

  <div class="btn-group">
    <a class="btn download"
       href="${paper.pdfUrl}"
       target="_blank">
       Open Paper
    </a>
  </div>
</div>
`;

    }

  });
  if (papersList.innerHTML === "") {
  papersList.innerHTML = `
   <div style="display:flex; justify-content:center; align-items:center; min-height:100px; font-family:'Outfit', sans-serif; font-size:18px; font-weight:500;">
    No papers Available 
</div>
  `;
}
}

window.addEventListener("load", () => {

  const branch = sessionStorage.getItem("branch");
  const semester = sessionStorage.getItem("semester");
  const exam = sessionStorage.getItem("exam");

  if (branch)
    document.getElementById("filterBranch").value = branch;

  if (semester)
    document.getElementById("filterSemester").value = semester;

  if (exam)
    document.getElementById("filterExam").value = exam;

  loadPapers();
});
window.viewPdf = function(url) {
  window.open(url, "_blank");
};

</script>
</body>
</html>
