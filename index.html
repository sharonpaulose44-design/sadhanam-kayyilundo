<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sadhanam Kayyilundo</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Russo+One&family=Space+Grotesk:wght@400;500;600;700&display=swap');

/* ========================================
   RESET
======================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:

        radial-gradient(
            circle at 90% 0%,
            rgba(37,99,235,.15),
            transparent 28%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(30,64,175,.10),
            transparent 25%
        ),

        #050B18;

    color:#F1F5F9;

    min-height:100vh;

    font-family:'Plus Jakarta Sans',sans-serif;
}


/* ========================================
   HEADER
======================================== */

header{

    text-align:center;

    padding:48px 20px 42px;

    background:
        linear-gradient(
            145deg,
            #091326,
            #050B18
        );

    border-bottom:1px solid #172642;

    position:relative;

    overflow:hidden;
}


header::before{

    content:"";

    position:absolute;

    width:320px;
    height:320px;

    background:#2563EB;

    opacity:.08;

    filter:blur(100px);

    top:-190px;

    left:50%;

    transform:translateX(-50%);
}


header h1{

    position:relative;

    font-family:'Space Grotesk',sans-serif;

    font-size:2.4rem;

    font-weight:600;

    letter-spacing:-1px;

    color:#F8FAFC;

    margin-bottom:9px;
}


header p{

    position:relative;

    color:#8FA3BF;

    font-size:.82rem;

    letter-spacing:.5px;
}


/* ========================================
   CONTAINER
======================================== */

.container{

    width:92%;

    max-width:820px;

    margin:25px auto;
}


/* ========================================
   CARDS
======================================== */

.card{

    background:
        linear-gradient(
            145deg,
            #0C172B,
            #091221
        );

    border:1px solid #172642;

    border-radius:12px;

    padding:16px;

    margin-bottom:13px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.35);

    transition:.25s ease;
}


.card:hover{

    border-color:#24426F;

    box-shadow:
        0 10px 32px rgba(0,0,0,.45);
}


.card h2{

    font-family:'Space Grotesk',sans-serif;

    color:#DCE8F8;

    font-size:.95rem;

    font-weight:600;

    letter-spacing:.2px;

    margin-bottom:10px;
}


/* ========================================
   INPUTS
======================================== */

select,
input[type="text"],
input[type="file"]{

    width:100%;

    padding:11px 13px;

    margin-top:7px;

    border-radius:8px;

    border:1px solid #203452;

    background:#07101F;

    color:#F1F5F9;

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:13px;

    outline:none;

    transition:.2s;
}


select:hover,
input[type="text"]:hover,
input[type="file"]:hover{

    border-color:#2D4A70;
}


select:focus,
input[type="text"]:focus,
input[type="file"]:focus{

    border-color:#3B82F6;

    box-shadow:
        0 0 0 2px rgba(59,130,246,.10);
}


/* ========================================
   BUTTON
======================================== */

.btn,
.upload-btn{

    width:100%;

    padding:11px;

    margin-top:11px;

    border:none;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #2563EB,
            #1D4ED8
        );

    color:#FFFFFF;

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;
}


.btn:hover,
.upload-btn:hover{

    background:
        linear-gradient(
            135deg,
            #3B82F6,
            #2563EB
        );

    transform:translateY(-1px);

    box-shadow:
        0 7px 20px rgba(37,99,235,.20);
}


.upload-btn{

    margin-top:12px;
}


/* ========================================
   PAPERS LIST
======================================== */

#papersList{

    min-height:150px !important;

    max-height:450px !important;

    overflow-y:auto !important;
}


#papersList::-webkit-scrollbar{

    width:4px;
}


#papersList::-webkit-scrollbar-track{

    background:#050B18;
}


#papersList::-webkit-scrollbar-thumb{

    background:#29466D;

    border-radius:20px;
}


/* ========================================
   PAPER
======================================== */

.paper{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:14px;

    padding:12px 14px;

    margin-bottom:8px;

    background:
        linear-gradient(
            145deg,
            #0E1A2E,
            #0A1424
        );

    border:1px solid #1A2B45;

    border-radius:9px;

    transition:.2s ease;
}


.paper:hover{

    border-color:#315685;

    background:#101D32;
}


.paper h3{

    color:#F1F5F9;

    font-size:14px;

    font-weight:600;

    margin-bottom:3px;
}


.paper p{

    color:#8195AF;

    font-size:11px;

    margin:0;
}


/* ========================================
   OPEN PAPER
======================================== */

.paper a{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    white-space:nowrap;

    padding:7px 12px;

    border-radius:7px;

    background:#2563EB !important;

    color:#FFFFFF !important;

    border:1px solid #3B82F6 !important;

    text-decoration:none;

    font-family:'Space Grotesk',sans-serif;

    font-size:10px;

    font-weight:600;

    letter-spacing:.3px;

    transition:.2s ease;
}


.paper a:hover{

    background:#3B82F6 !important;

    color:#FFFFFF !important;

    border-color:#60A5FA !important;

    transform:translateY(-1px);

    box-shadow:
        0 5px 15px rgba(37,99,235,.20);
}


/* ========================================
   FOOTER
======================================== */

footer{

    text-align:center;

    padding:30px 15px;

    color:#53657E;

    font-size:11px;

    letter-spacing:.5px;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:768px){

    header{

        padding:38px 16px 32px;
    }


    header h1{

        font-size:1.7rem;

        letter-spacing:-.5px;
    }


    header p{

        font-size:.72rem;
    }


    .container{

        width:94%;

        margin:20px auto;
    }


    .card{

        padding:14px;

        margin-bottom:10px;

        border-radius:10px;
    }


    .card h2{

        font-size:.88rem;
    }


    .paper{

        padding:11px;

        gap:9px;
    }


    .paper h3{

        font-size:13px;
    }


    .paper p{

        font-size:10px;
    }
.paper span{
    font-family:'Russo One', sans-serif !important;
    font-size:21px !important;
    font-weight:400 !important;
    letter-spacing:0.2px !important;
    color:#E8EEF7 !important;
}

    .paper a{

        padding:7px 10px;

        font-size:9px;
    }

}

</style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header>

    <h1>📚 Sadhanam Kayyilundo</h1>

    <p>
        SJCET Previous Question Paper Repository
    </p>

    <p>
        <b>Sadhanam Kayyilundo? PYQ ivide und!</b>
    </p>

</header>



<div class="container">


<!-- ========================================
     BRANCH
======================================== -->

<div class="card">

    <h2>Select Branch</h2>

    <select id="filterBranch">

        <option>CSE</option>

        <option>AI & DS</option>

        <option>ECE</option>

        <option>EEE</option>

        <option>Mechanical</option>

        <option>Civil</option>

    </select>

</div>



<!-- ========================================
     SEMESTER
======================================== -->

<div class="card">

    <h2>Select Semester</h2>

    <select id="filterSemester">

        <option>Semester 1</option>

        <option>Semester 2</option>

        <option>Semester 3</option>

        <option>Semester 4</option>

        <option>Semester 5</option>

        <option>Semester 6</option>

        <option>Semester 7</option>

        <option>Semester 8</option>

    </select>

</div>



<!-- ========================================
     EXAM
======================================== -->

<div class="card">

    <h2>Select Exam Type</h2>

    <select id="filterExam">

        <option>1st Internal</option>

        <option>2nd Internal</option>

        <option>End Semester</option>

    </select>


    <br>
    <br>


    <button
        class="btn"
        onclick="loadPapers()"
    >
        View Papers
    </button>


    <br>
    <br>

</div>



<!-- ========================================
     AVAILABLE PAPERS
======================================== -->

<div class="card">

    <h2>Available Papers</h2>

    <div id="papersList"></div>

</div>



<!-- ========================================
     UPLOAD
======================================== -->

<div class="card">

    <h2>Upload Question Paper</h2>


    <input
        type="text"
        id="subject"
        placeholder="Subject Name"
    >


    <select id="branch">

        <option>Select Branch</option>

        <option>CSE</option>

        <option>AI & DS</option>

        <option>ECE</option>

        <option>EEE</option>

        <option>Mechanical</option>

        <option>Civil</option>

    </select>


    <select id="semester">

        <option>Select Semester</option>

        <option>Semester 1</option>

        <option>Semester 2</option>

        <option>Semester 3</option>

        <option>Semester 4</option>

        <option>Semester 5</option>

        <option>Semester 6</option>

        <option>Semester 7</option>

        <option>Semester 8</option>

    </select>


    <select id="exam">

        <option>Select Exam</option>

        <option>1st Internal</option>

        <option>2nd Internal</option>

        <option>End Semester</option>

    </select>


    <input
        type="file"
        id="pdfFile"
        accept=".pdf"
    >


    <button
        class="upload-btn"
        onclick="uploadPaper()"
    >
        Upload For Review
    </button>

</div>


</div>



<!-- ========================================
     FOOTER
======================================== -->

<footer>

    <p>© Sadhanam Kayyilundo</p>

    <p>
        Open Source PYQ Platform for Sjcet Students
    </p>

</footer>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { createClient } from "https://esm.sh/@supabase/supabase-js";


const firebaseConfig = {
    apiKey: "AIzaSyDtVwW1Ftz8q8XJukMGgSV5qsqZc9Fl2M0",
    authDomain: "sadhanam-kayyilundo-c39dd.firebaseapp.com",
    projectId: "sadhanam-kayyilundo-c39dd",
    storageBucket: "sadhanam-kayyilundo-c39dd.firebasestorage.app",
    messagingSenderId: "986132708992",
    appId: "1:986132708992:web:724843c7e3ef675315b065"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const supabase = createClient(
    "https://xczmunaxzkzfapksolxc.supabase.co",
    "sb_publishable_x2ZQqhJabAfgZiA7bY9C-Q_FIVcc7Va"
);


/* ===============================
   PAPER CACHE
=============================== */

const paperCache = new Map();


/* ===============================
   DISPLAY PAPERS
=============================== */

function displayPapers(papers) {

    const papersList =
        document.getElementById("papersList");

    papersList.innerHTML = "";


    if (papers.length === 0) {

        papersList.innerHTML = `
            <div style="
                text-align:center;
                padding:30px;
                color:#8195AF;
                font-size:15px;
            ">
                No papers Available
            </div>
        `;

        return;
    }


    papers.forEach((paper) => {

        papersList.innerHTML += `
            <div class="paper">

                <span>
                    ${paper.subject}
                </span>

                <div class="btn-group">

                    <a
                        class="btn download"
                        href="${paper.pdfUrl}"
                        target="_blank"
                    >
                        Open Paper
                    </a>

                </div>

            </div>
        `;

    });

}


/* ===============================
   LOAD PAPERS
=============================== */

window.loadPapers = async function () {

    const branch =
        document.getElementById("filterBranch").value;

    const semester =
        document.getElementById("filterSemester").value;

    const exam =
        document.getElementById("filterExam").value;


    sessionStorage.setItem("branch", branch);
    sessionStorage.setItem("semester", semester);
    sessionStorage.setItem("exam", exam);


    /* UNIQUE CACHE KEY */

    const cacheKey =
        branch + "|" + semester + "|" + exam;


    /* ===============================
       CHECK CACHE
    =============================== */

    if (paperCache.has(cacheKey)) {

        console.log(
            "CACHE USED:",
            cacheKey
        );

        displayPapers(
            paperCache.get(cacheKey)
        );

        return;
    }


    /* ===============================
       FIRESTORE
    =============================== */

    console.log(
        "FIRESTORE FETCH:",
        cacheKey
    );


    const papersQuery = query(

        collection(db, "papers"),

        where("branch", "==", branch),

        where("semester", "==", semester),

        where("examType", "==", exam),

        where("status", "==", "approved")

    );


    try {

        document.getElementById(
            "papersList"
        ).innerHTML = `
            <div style="
                text-align:center;
                padding:30px;
                color:#8195AF;
            ">
                Loading papers...
            </div>
        `;


        const snapshot =
            await getDocs(papersQuery);


        const papers = [];


        snapshot.forEach((doc) => {

            papers.push({
                id: doc.id,
                ...doc.data()
            });

        });


        /* SAVE TO CACHE */

        paperCache.set(
            cacheKey,
            papers
        );


        console.log(
            "SAVED TO CACHE:",
            cacheKey
        );


        displayPapers(papers);


    } catch (error) {

        console.error(error);

        document.getElementById(
            "papersList"
        ).innerHTML = `
            <div style="
                text-align:center;
                padding:30px;
                color:#EF4444;
            ">
                Failed to load papers.
            </div>
        `;

    }

};


/* ===============================
   UPLOAD PAPER
=============================== */

window.uploadPaper = async function () {

    const file =
        document.getElementById("pdfFile").files[0];

    const subject =
        document.getElementById("subject").value;

    const branch =
        document.getElementById("branch").value;

    const semester =
        document.getElementById("semester").value;

    const exam =
        document.getElementById("exam").value;


    if (
        branch === "Select Branch" ||
        semester === "Select Semester" ||
        exam === "Select Exam" ||
        subject.trim() === ""
    ) {

        alert("Please fill all fields");
        return;
    }


    if (!file) {

        alert("Please select a PDF");
        return;
    }


    if (file.type !== "application/pdf") {

        alert("Only PDF files are allowed");
        return;
    }


    try {

        const fileName =
            Date.now() + "_" + file.name;


        const { error } =
            await supabase.storage
                .from("papers")
                .upload(fileName, file);


        if (error) {
            throw error;
        }


        const { data: publicData } =
            supabase.storage
                .from("papers")
                .getPublicUrl(fileName);


        const pdfUrl =
            publicData.publicUrl;


        await addDoc(
            collection(db, "papers"),
            {
                subject: subject,
                branch: branch,
                semester: semester,
                examType: exam,
                pdfUrl: pdfUrl,
                status: "pending"
            }
        );


        alert("Paper uploaded successfully!");


        document.getElementById(
            "subject"
        ).value = "";

        document.getElementById(
            "pdfFile"
        ).value = "";

        document.getElementById(
            "branch"
        ).selectedIndex = 0;

        document.getElementById(
            "semester"
        ).selectedIndex = 0;

        document.getElementById(
            "exam"
        ).selectedIndex = 0;


    } catch (error) {

        console.error(error);

        alert(error.message);

    }

};


/* ===============================
   RESTORE LAST SELECTION
=============================== */

window.addEventListener("load", () => {

    const branch =
        sessionStorage.getItem("branch");

    const semester =
        sessionStorage.getItem("semester");

    const exam =
        sessionStorage.getItem("exam");


    if (branch) {

        document.getElementById(
            "filterBranch"
        ).value = branch;

    }


    if (semester) {

        document.getElementById(
            "filterSemester"
        ).value = semester;

    }


    if (exam) {

        document.getElementById(
            "filterExam"
        ).value = exam;

    }


    loadPapers();

});


/* ===============================
   VIEW PDF
=============================== */

window.viewPdf = function (url) {

    window.open(url, "_blank");

};

</script>
</body>
</html>
